spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}

  cache:
    type: redis
    redis:
      time-to-live: 1m
      cache-null-values: false
#      key-prefix: "technical-academy:"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

services:
  invoice:
    base-url: http://localhost:8083/api/invoices/generate

logging:
  level:
    root: INFO
    com.learning.springboot: DEBUG