spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

services:
  invoice:
    base-url: ${INVOICE_SERVICE_URL:http://localhost:8083/api/invoices/generate}

logging:
  level:
    root: INFO
    com.learning.springboot: DEBUG